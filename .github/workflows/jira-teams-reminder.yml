name: Jira to Teams reminder

on:
  schedule:
    # Twice a working day, in Ulaanbaatar time: 10:00 and 15:00, which sit
    # inside the two windows the team asked for (09:00-12:00 and 14:00-18:00).
    # Cron is UTC and Mongolia is UTC+8 all year — it dropped daylight saving
    # after 2016 — so no seasonal drift to correct for.
    #
    # The schedule is now the cadence, which is why
    # REMINDER_DELIVERY_WINDOW_MINUTES must equal REMINDER_REPEAT_MINUTES. Any
    # narrower window would silently drop breaches: the gaps between these runs
    # are 300 and 1140 minutes, both whole multiples of 60, so `elapsed % 60`
    # never changes for a given request and whoever starts outside the window
    # stays outside it forever.
    - cron: '0 2 * * 1-5'
    - cron: '0 7 * * 1-5'
  workflow_dispatch:
    inputs:
      dry_run:
        description: Fetch and select tickets without posting to Teams
        type: boolean
        default: true
      seed_only:
        description: >-
          One-time rollout step. Record every escalation level already crossed
          and notify nobody. Requires dry_run to be false. An input rather than
          a variable so it cannot be left switched on.
        type: boolean
        default: false
permissions:
  contents: read
  id-token: write

concurrency:
  group: jira-teams-reminder
  cancel-in-progress: false

jobs:
  remind:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - name: Verify repository toolchain
        run: node scripts/verify-toolchain.mjs
      - run: npm ci
      - run: npm test
      - run: npm run typecheck

      # The escalation directory names real people — emails, Jira account ids and
      # Entra object ids — and this repository is public, so the file is
      # gitignored and carried as a secret instead. Locally it is just a file.
      - name: Write the escalation directory
        env:
          ESCALATION_DIRECTORY_JSON: ${{ secrets.ESCALATION_DIRECTORY_JSON }}
        run: |
          if [ -n "$ESCALATION_DIRECTORY_JSON" ]; then
            mkdir -p config
            printf '%s' "$ESCALATION_DIRECTORY_JSON" > config/escalation.json
            echo "Escalation directory written from the repository secret."
          else
            echo "No ESCALATION_DIRECTORY_JSON secret set; the run will fail if the bot is configured."
          fi

      # Carries "highest escalation level notified per ticket" between runs.
      # Restore and save are separate steps on purpose: actions/cache skips its
      # post-run upload when the job fails, and this job deliberately fails when
      # any recipient could not be reached — so the runs whose partial progress
      # matters most were exactly the ones that discarded it, re-notifying every
      # level that had succeeded. `if: always()` saves either way.
      #
      # The key is unique per run with a prefix restore, because a cache entry
      # cannot be overwritten in place. A miss re-notifies a level rather than
      # skipping one.
      - name: Restore escalation state
        uses: actions/cache/restore@v4
        with:
          path: .escalation-state
          key: escalation-state-${{ github.run_id }}
          restore-keys: escalation-state-

      - name: Authenticate to Google Cloud
        if: vars.REMINDER_USE_LLM_INTRO == 'true'
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Run reminder
        env:
          GOOGLE_CLOUD_PROJECT: ${{ secrets.GOOGLE_CLOUD_PROJECT }}
          GOOGLE_CLOUD_LOCATION: ${{ secrets.GOOGLE_CLOUD_LOCATION }}
          JIRA_BASE_URL: ${{ secrets.JIRA_BASE_URL }}
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
          JIRA_JQL: ${{ vars.JIRA_JQL }}
          JIRA_FIRST_RESPONSE_SLA_NAME: ${{ vars.JIRA_FIRST_RESPONSE_SLA_NAME }}
          JIRA_RESOLUTION_SLA_NAME: ${{ vars.JIRA_RESOLUTION_SLA_NAME }}
          JIRA_PARTICIPANTS_FIELD: ${{ vars.JIRA_PARTICIPANTS_FIELD }}
          JIRA_PAGE_SIZE: ${{ vars.JIRA_PAGE_SIZE }}
          JIRA_MAX_RESULTS: ${{ vars.JIRA_MAX_RESULTS }}
          JIRA_MAX_SEARCH_PAGES: ${{ vars.JIRA_MAX_SEARCH_PAGES }}
          JIRA_SLA_PAGE_SIZE: ${{ vars.JIRA_SLA_PAGE_SIZE }}
          JIRA_MAX_SLA_PAGES: ${{ vars.JIRA_MAX_SLA_PAGES }}
          JIRA_SLA_CONCURRENCY: ${{ vars.JIRA_SLA_CONCURRENCY }}
          REMINDER_REPEAT_MINUTES: ${{ vars.REMINDER_REPEAT_MINUTES }}
          REMINDER_DELIVERY_WINDOW_MINUTES: ${{ vars.REMINDER_DELIVERY_WINDOW_MINUTES }}
          REMINDER_USE_LLM_INTRO: ${{ vars.REMINDER_USE_LLM_INTRO }}
          REMINDER_DRY_RUN: ${{ inputs.dry_run || 'false' }}
          TEAMS_WEBHOOK_URL: ${{ secrets.TEAMS_WEBHOOK_URL }}
          TEAMS_BOT_APP_ID: ${{ vars.TEAMS_BOT_APP_ID }}
          # Prefer the OIDC federated credential on the app registration
          # (id-token: write above), which stores no secret. This secret is the
          # fallback for a tenant where the credential is not configured yet;
          # unset, it is empty and the OIDC path is taken.
          TEAMS_BOT_APP_PASSWORD: ${{ secrets.TEAMS_BOT_APP_PASSWORD }}
          TEAMS_BOT_TENANT_ID: ${{ vars.TEAMS_BOT_TENANT_ID }}
          TEAMS_BOT_SERVICE_URL: ${{ vars.TEAMS_BOT_SERVICE_URL }}
          TEAMS_APP_EXTERNAL_ID: ${{ vars.TEAMS_APP_EXTERNAL_ID }}
          GRAPH_CLIENT_ID: ${{ vars.GRAPH_CLIENT_ID }}
          ESCALATION_SEED_ONLY: ${{ inputs.seed_only || 'false' }}
          TEAMS_BOT_RECIPIENT_ALLOWLIST: ${{ vars.TEAMS_BOT_RECIPIENT_ALLOWLIST }}
          TEAMS_MAX_MESSAGE_CHARS: ${{ vars.TEAMS_MAX_MESSAGE_CHARS }}
          HTTP_TIMEOUT_MS: ${{ vars.HTTP_TIMEOUT_MS }}
          HTTP_MAX_RETRIES: ${{ vars.HTTP_MAX_RETRIES }}
        run: npm run remind

      - name: Save escalation state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .escalation-state
          key: escalation-state-${{ github.run_id }}
