name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
          cache: npm
      - name: Verify Node and npm versions
        run: |
          node --version
          npm --version
          test "$(node --version)" = "v22.19.0"
          test "$(npm --version)" = "10.9.3"
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
