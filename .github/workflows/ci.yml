name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - name: Verify repository toolchain
        run: node scripts/verify-toolchain.mjs
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
